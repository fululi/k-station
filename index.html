<script>
"use strict";
/* ================= 数据层：东财 JSONP（手机浏览器可跨域） ================= */
var UT = "fa5fd1943c7b386f172d6893dbfba10b";
function isUS(code) { return /^us/i.test(code); }
function typeOf(code) { for (var ti = 0; ti < S.codes.length; ti++) if (S.codes[ti][0] === code) return S.codes[ti][2] || ""; return ""; }
function isIndex(code) { return typeOf(code) === "ZS"; }
function noFund(code) { return isUS(code) || isIndex(code); }
function secidOf(code) { var b = code.replace(/^(sh|sz)/, ""); return /^[569]/.test(b) ? "1." + b : "0." + b; }
function jsonp(url, cb, ms) {
  var name = "emcb_" + Date.now() + "_" + Math.round(Math.random() * 1e9);
  var s = document.createElement("script");
  var done = false;
  function fin(err, data) {
    if (done) return; done = true;
    if (s.parentNode) s.parentNode.removeChild(s);
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    cb(err, data);
  }
  window[name] = function (d) { fin(null, d); };
  s.onerror = function () { fin(new Error("网络错误")); };
  s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "cb=" + name;
  document.head.appendChild(s);
  setTimeout(function () { fin(new Error("请求超时")); }, ms || 12000);
}
function txPrefix(code, stripSuffix) {
  if (isUS(code)) { var u = code.toUpperCase(); return stripSuffix ? u.split(".")[0] : u; }
  if (/^(sh|sz)/.test(code)) return code;
  return (/^[569]/.test(code) ? "sh" : (/^[03]/.test(code) ? "sz" : "sh")) + code;
}
function fetchJSON(url, cb) {
  var done = false;
  var to = setTimeout(function () { if (!done) { done = true; cb(new Error("请求超时")); } }, 10000);
  fetch(url).then(function (r) { return r.json(); }).then(function (d) {
    if (!done) { done = true; clearTimeout(to); cb(null, d); }
  }).catch(function (e) { if (!done) { done = true; clearTimeout(to); cb(e); } });
}
// 腾讯格式 [日期,开,收,高,低,量]（分钟线日期为 yyyyMMddHHmm）→ 统一 [date, o, h, l, c, v]
function txRows(rows) {
  return rows.map(function (r) {
    var ds = String(r[0]);
    if (ds.length === 12) ds = ds.slice(0, 4) + "-" + ds.slice(4, 6) + "-" + ds.slice(6, 8) + " " + ds.slice(8, 10) + ":" + ds.slice(10, 12);
    return [ds, +r[1], +r[3], +r[4], +r[2], +r[5]];
  }).filter(function (r) { return r[4] > 0; });
}
function fetchKlineTX(code, klt, cb) {
  if (isUS(code) && klt !== "101" && klt !== "102") { cb(new Error("美股仅支持日线/周线")); return; }
  var prefix = txPrefix(code);
  var kA = klt === "5D" ? "5" : klt;
  if (klt === "101" || klt === "102") {
    var per = klt === "101" ? "day" : "week";
    var api2 = isUS(code) ? "usfqkline" : "fqkline";
    fetchJSON("https://web.ifzq.gtimg.cn/appstock/app/" + api2 + "/get?param=" + prefix + "," + per + ",,,320,qfq", function (err, d) {
      var sd = d && d.data && d.data[prefix];
      var rows = sd && (sd["qfq" + per] || sd[per]);
      if (err || !rows || !rows.length) { cb(err || new Error("腾讯无K线")); return; }
      cb(null, txRows(rows), "");
    });
  } else {
    fetchJSON("https://ifzq.gtimg.cn/appstock/app/kline/mkline?param=" + prefix + ",m" + kA + ",,320", function (err, d) {
      var sd = d && d.data && d.data[prefix];
      var rows = sd && sd["m" + kA];
      if (err || !rows || !rows.length) { cb(err || new Error("腾讯无分钟K线")); return; }
      cb(null, txRows(rows), "");
    });
  }
}
// 东财 JSONP 兜底（腾讯失败时）
function fetchKlineEM(code, klt, cb) {
  if (klt === "5D") klt = "5";
  var url = "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=" + secidOf(code) +
    "&ut=" + UT + "&fields1=f1,f2,f3&fields2=f51,f52,f53,f54,f55,f56&klt=" + klt + "&fqt=1&end=20500101&lmt=320";
  jsonp(url, function (err, d) {
    if (err || !d || !d.data || !d.data.klines) { cb(err || new Error("无K线数据")); return; }
    // 东财格式 "日期,开,收,高,低,量" → [date, o, h, l, c, v]
    var kl = d.data.klines.map(function (row) {
      var p = row.split(",");
      return [p[0], +p[1], +p[3], +p[4], +p[2], +p[5]];
    }).filter(function (r) { return r[4] > 0; });
    cb(null, kl, d.data.name || "");
  });
}
function fetchKline(code, klt, cb) {
  fetchKlineTX(code, klt, function (err, kl, name) {
    if (!err && kl && kl.length) { cb(null, kl, name); return; }
    if (isUS(code)) { cb(err || new Error("无K线数据")); return; }
    fetchKlineEM(code, klt, cb);
  });
}
function fetchQuoteEM(code, cb) {
  var url = "https://push2.eastmoney.com/api/qt/stock/get?secid=" + secidOf(code) +
    "&ut=" + UT + "&fltt=2&invt=2&fields=f43,f57,f58,f60,f117,f170";
  jsonp(url, function (err, d) {
    if (err || !d || !d.data || !(d.data.f43 > 0)) { cb(err || new Error("无报价")); return; }
    cb(null, { price: d.data.f43, name: d.data.f58, prev: d.data.f60, pct: d.data.f170, floatMV: d.data.f117 > 0 ? d.data.f117 : 0 });
  });
}
// 腾讯行情快照（qt.gtimg.cn，GBK 文本，CORS 放行）：f[1]名称 f[3]现价 f[4]昨收 f[44]流通市值(亿)
function fetchQuote(code, cb) {
  var prefix = txPrefix(code, true);
  var done = false;
  var to = setTimeout(fail, 8000);
  function fail() {
    if (!done) {
      done = true; clearTimeout(to);
      if (isUS(code)) { cb(new Error("无报价")); return; }
      fetchQuoteEM(code, cb);
    }
  }
  fetch("https://qt.gtimg.cn/q=" + prefix)
    .then(function (r) { return r.arrayBuffer(); })
    .then(function (buf) {
      if (done) return;
      var f = String(new TextDecoder("gbk").decode(buf)).split("~");
      var price = parseFloat(f[3]), prev = parseFloat(f[4]);
      if (!(price > 0)) { fail(); return; }
      done = true; clearTimeout(to);
      var fmv = parseFloat(f[44]);
      cb(null, { price: price, name: f[1], prev: prev, pct: prev > 0 ? (price / prev - 1) * 100 : 0, floatMV: fmv > 0 ? fmv * 1e8 : 0 });
    })
    .catch(fail);
}
// 腾讯联想搜索：名称/拼音 → 代码（A股个股/指数/ETF/美股）
function unesc(s2) { try { return JSON.parse('"' + s2 + '"'); } catch (e) { return s2; } }
function searchCode(kw, cb) {
  var sc = document.createElement("script");
  var done = false;
  function fin(r) {
    if (done) return; done = true;
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    cb(r);
  }
  sc.onload = function () {
    var txt = window.v_hint || "";
    var items = String(txt).split("^");
    for (var i = 0; i < items.length; i++) {
      var f = items[i].split("~");
      if (f.length < 5) continue;
      if (f[0] === "us") { fin({ code: "us" + f[1].toUpperCase(), name: unesc(f[2]), type: "US" }); return; }
      if ((f[0] === "sh" || f[0] === "sz") && (f[4] === "GP-A" || f[4] === "ZS" || f[4] === "ETF" || f[4] === "FJ")) {
        fin({ code: f[0] + f[1], name: unesc(f[2]), type: f[4] }); return;
      }
    }
    fin(null);
  };
  sc.onerror = function () { fin(null); };
  sc.src = "https://smartbox.gtimg.cn/s3/?v=2&q=" + encodeURIComponent(kw) + "&t=all";
  document.head.appendChild(sc);
  setTimeout(function () { fin(null); }, 8000);
}
// 日级资金流历史（东财）：f51日期 f52主力净额(元) f57主力净占比%
function fetchFFlow(code, cb) {
  var url = "https://push2his.eastmoney.com/api/qt/stock/fflow/daykline/get?secid=" + secidOf(code) +
    "&ut=" + UT + "&lmt=320&end=20500101&fields1=f1,f2,f3,f7&fields2=f51,f52,f53,f54,f55,f56,f57";
  jsonp(url, function (err, d) {
    if (err || !d || !d.data || !d.data.klines) { if (cb) cb(err || new Error("无资金流")); return; }
    S.fflow = d.data.klines.map(function (row) {
      var p = row.split(",");
      return { d: p[0], main: +p[1], mainPct: +p[6] };
    });
    if (cb) cb(null);
  });
}
// 盘中分钟级资金流（东财）：f51时间 f52主力净流入/分钟(元) f56超大单 —— 实时主力曲线数据源
function fetchFFlowMin(code, cb) {
  var q = "secid=" + secidOf(code) + "&ut=" + UT + "&lmt=0&klt=1&fields1=f1,f2,f3,f7&fields2=f51,f52,f53,f54,f55,f56";
  function parse(d) {
    if (!d || !d.data || !d.data.klines) return null;
    var day = "";
    var rows = [];
    d.data.klines.forEach(function (row) {
      var p = row.split(",");
      if (p.length < 2) return;
      var t = p[0];
      if (!day) day = t.slice(0, 10);
      if (t.slice(0, 10) !== day) return;
      var main = parseFloat(p[1]), sup = parseFloat(p[5]);
      rows.push({ t: t, main: isNaN(main) ? 0 : main, sup: isNaN(sup) ? 0 : sup });
    });
    return rows;
  }
  // 双通道竞速：push2his / push2 同时发，谁先返回有效数据用谁（解决加载慢）
  var done = false;
  function win(rows) {
    if (done) return; done = true;
    S.rtflow = rows; if (cb) cb(null);
  }
  function lose() { if (!done) { done = true; if (cb) cb(new Error("无盘中资金流")); } }
  jsonp("https://push2his.eastmoney.com/api/qt/stock/fflow/kline/get?" + q, function (err, d) {
    var rows = !err && parse(d);
    if (rows) win(rows); else if (done) {} // 另一通道可能已成功
  }, 8000);
  jsonp("https://push2.eastmoney.com/api/qt/stock/fflow/kline/get?" + q, function (err, d) {
    var rows = !err && parse(d);
    if (rows) win(rows);
  }, 8000);
  setTimeout(function () { if (!done) lose(); }, 9000);
}
/* ================= 状态与持久化 ================= */
var PERIODS = [["101", "日线"], ["5D", "5日"], ["102", "周线"], ["60", "60分"], ["30", "30分"], ["15", "15分"], ["5", "5分"]];
var TOOLS = [["trend", "趋势线", 2], ["hline", "水平线", 1], ["ray", "射线", 2], ["rect", "矩形", 2], ["fib", "斐波那契", 2], ["pct", "测幅%", 2], ["tri", "三角形", 3], ["xabcd", "蝴蝶XABCD", 5], ["freedraw", "画笔", 2], ["lrchan", "画回归", 2], ["buy", "买点线", 1]];
var S = {
  codes: [["600105", "永鼎股份"], ["600176", "中国巨石"], ["515880", "通信ETF"]],
  active: "600105", klt: "101",
  kl: [], name: "", quote: null,
  end: 0, count: 0,
  tool: null, pending: [], selected: -1, cross: null, ghost: null,
  ind: { ma: true, tsline: false, lr: false, fvg: false, liq: false, ms: false, ob: false, ddx: false, zlyy: false, pdhl: false, tdhl: true, rtflow: true, boll: false, monitor: true, solid: false, atri: true },
  triScan: null,
  fflow: [], rtflow: [], floatMV: 0,
  lineMode: false, pdhlMode: "day", yZoom: 1, yOff: 0, monOpen: false, collapsed: false
};
var DRAW = {}; // "code:klt" -> [{type, pts:[{i,p}...]}]
function store() {
  try {
    localStorage.setItem("ksm_v1", JSON.stringify({ v: 3, codes: S.codes, active: S.active, klt: S.klt, ind: S.ind, draw: DRAW, lineMode: S.lineMode, pdhlMode: S.pdhlMode, monOpen: S.monOpen, collapsed: S.collapsed }));
  } catch (e) {}
}
function restore() {
  try {
    var o = JSON.parse(localStorage.getItem("ksm_v1") || "null");
    if (!o) return;
    if (o.codes && o.codes.length) S.codes = o.codes;
    if (o.active) S.active = o.active;
    if (o.klt) S.klt = o.klt;
    if (o.ind) { S.ind = o.ind; if (S.ind.ma == null) S.ind.ma = true; if (S.ind.tsline == null) S.ind.tsline = true; if (S.ind.lr == null || S.ind.lr === true) S.ind.lr = "view"; if (S.ind.solid == null) S.ind.solid = false; if (S.ind.atri == null) S.ind.atri = true; if (S.ind.ddx == null) S.ind.ddx = false; if (S.ind.pdhl == null) S.ind.pdhl = true; if (S.ind.tdhl == null) S.ind.tdhl = true; if (S.ind.rtflow == null) S.ind.rtflow = true; if (S.ind.boll == null) S.ind.boll = true; if (S.ind.monitor == null) S.ind.monitor = true; }
    if (o.lineMode != null) S.lineMode = !!o.lineMode;
    if (o.pdhlMode) S.pdhlMode = o.pdhlMode;
    if (o.monOpen != null) S.monOpen = !!o.monOpen;
    if (o.draw) DRAW = o.draw;
    if (o.collapsed != null) S.collapsed = !!o.collapsed;

  } catch (e) {}
}
function dkey() { return S.active + ":" + S.klt; }
function dlist() { var k = dkey(); if (!DRAW[k]) DRAW[k] = []; return DRAW[k]; }
/* ================= 图表渲染 ================= */
var cv = document.querySelector("[data-chart]");
var hintEl = document.querySelector("[data-hint]");
function hint(t) { hintEl.innerHTML = t || ""; }
function cls(p) { return p == null || isNaN(p) ? "flat" : (p > 0 ? "up" : (p < 0 ? "down" : "flat")); }
function dec() { var t = typeOf(S.active); return (t === "ETF" || t === "FJ" || S.active === "515880") ? 3 : 2; }
function fwp(v) { var d2 = dec(); return v == null || isNaN(v) ? "—" : v.toFixed(d2); }
var UP = "#ff6f66", DN = "#35d99a", DIM = "#5d6f64", GRID = "rgba(38,51,44,0.6)", SEL = "#ffd21f";
function maArr(kl, n) {
  var out = new Array(kl.length).fill(null), s = 0;
  for (var i = 0; i < kl.length; i++) {
    s += kl[i][4];
    if (i >= n) s -= kl[i - n][4];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}
function emaArr(kl, n) {
  var out = new Array(kl.length).fill(null), k2 = 2 / (n + 1), e = null;
  for (var i = 0; i < kl.length; i++) {
    var c = kl[i][4];

    if (i >= n - 1) out[i] = e;
  }
  return out;
}
function bollArr(kl, n, k) {
  var mid = new Array(kl.length).fill(null), up = new Array(kl.length).fill(null), dn = new Array(kl.length).fill(null);
  for (var i = n - 1; i < kl.length; i++) {

  ic2.fvg.forEach(function (z) {
    if (z.i < n - 60 || z.top - z.bot < minH) return;
    if (z.bot > last) upG++; else if (z.top < last) dnG++;
  });
  if (upG || dnG) rows.push(["近60根有效缺口 · 上方 " + upG + " 个没补(压力) · 下方 " + dnG + " 个(支撑)", "#b78cff"]);
  // 6. 收敛三角形态（近50根摆动点：突破计入评分，末端未破只提示）
  var tr2 = triDetect(kl);
  if (tr2) {
    if (tr2.brk > 0) { total++; score++; rows.push(["▲ 三角向上突破 · 做多信号", UP]); }
    else if (tr2.brk < 0) { total++; rows.push(["▼ 三角向下跌破 · 空头信号", DN]); }
    else rows.push(["收敛三角末端 · 等突破方向", "#b78cff"]);
  }
  // 7. 多周期三角扫描（异步陆续补上；▲突破 ▼跌破 收敛=末端等方向 —=无形态 …=加载中）
  if (S.triScan && S.triScan.code === S.active) {
    var parts = [], upN = 0, dnN = 0;
    ["周", "日", "60分", "30分", "15分", "5分"].forEach(function (nm) {
      var b = S.triScan.res[nm];
      if (b === 0) parts.push(nm + "·收敛");
      else if (b > 0) { parts.push(nm + "·▲"); upN++; }
      else if (b < 0) { parts.push(nm + "·▼"); dnN++; }
    });
    if (parts.length) rows.push(["多周期三角 " + parts.join(" ") + ((upN + dnN) ? " · " + (upN + dnN) + "周期已突破" : " · 预判等方向"), upN ? UP : (dnN ? DN : "#b78cff")]);
  }
  // 综合评分
  var verdict = score >= total - 0.5 ? "偏多" : (score <= 1 ? "偏空" : "震荡");
  var vc = verdict === "偏多" ? UP : (verdict === "偏空" ? DN : "#d9b45c");
  rows.push(["综合 " + verdict + " " + score + "/" + total, vc]);
  // 绘制面板（收起态只一行，点面板展开/收起）
  ctx.font = "10px -apple-system, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  var bx = v.padL + 4, by = v.padT + 44;

    var one = "监测 " + verdict + " " + score + "/" + total + " ▸ 点我展开";
    var w1 = ctx.measureText(one).width;
    ctx.fillStyle = "rgba(10,14,11,0.82)";
    ctx.fillRect(bx, by, w1 + 26, 22);
    ctx.strokeStyle = vc; ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, w1 + 26, 22);
    ctx.fillStyle = vc;
    ctx.beginPath(); ctx.arc(bx + 9, by + 11, 3, 0, 7); ctx.fill();
    ctx.fillStyle = "#c3d2c6";
    ctx.fillText(one, bx + 17, by + 11);
    S.monRect = { x: bx, y: by, w: w1 + 26, h: 22 };
    return;
  }
  var bw4 = 0;
  rows.forEach(function (r) { bw4 = Math.max(bw4, ctx.measureText(r[0]).width); });
  var bh = rows.length * 15 + 24;
  ctx.fillStyle = "rgba(10,14,11,0.82)";
  ctx.fillRect(bx, by, bw4 + 26, bh);
  ctx.strokeStyle = vc; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw4 + 26, bh);
  ctx.fillStyle = "#8fa398";
  ctx.fillText("量化监测 · 再点收起", bx + 8, by + 9);
  rows.forEach(function (r, ri) {
    ctx.fillStyle = r[1];
    ctx.beginPath(); ctx.arc(bx + 8, by + 26 + ri * 15, 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = ri === rows.length - 1 ? r[1] : "#c3d2c6";
    ctx.fillText(r[0], bx + 16, by + 26 + ri * 15);
  });
  S.monRect = { x: bx, y: by, w: bw4 + 26, h: bh };
}
/* ================= 主力净额副图（东财日级真实口径：超大单+大单净额，一条线看方向） ================= */
function renderExtraPanes(ctx, v) {
  if (!S.ind.zlyy || noFund(S.active)) return;
  var kl = S.kl;
  var right = v.padL + (v.i1 - v.i0) * v.step;
  var isDay = S.klt === "101";
  var y2 = v.zlyyY, h2 = v.zlyyH;
  ctx.strokeStyle = GRID; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(v.padL, y2); ctx.lineTo(right, y2); ctx.stroke();
  ctx.fillStyle = DIM; ctx.font = "9px Menlo, monospace"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("主力净额（东财真实口径·每日）", v.padL + 4, y2 + 9);
  if (!isDay || !S.fflow.length) {
    ctx.fillStyle = DIM; ctx.font = "10px -apple-system, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(isDay ? "资金流数据加载中…" : "日级指标 · 切回日线查看", v.padL + (right - v.padL) / 2, y2 + h2 / 2);
    return;
  }
  var fm = {};
  S.fflow.forEach(function (r) { fm[r.d] = r; });
  var zv = kl.map(function (k3) { var r = fm[k3[0]]; return r ? r.main / 1e4 : null; });
  var zAbs = 1e-9, i2;
  for (i2 = v.i0; i2 < v.i1; i2++) if (zv[i2] != null) zAbs = Math.max(zAbs, Math.abs(zv[i2]));
  var ZY = function (val) { return y2 + h2 / 2 - val / zAbs * (h2 / 2 - 8); };
  ctx.strokeStyle = "rgba(150,180,166,0.9)";
  ctx.beginPath(); ctx.moveTo(v.padL, ZY(0)); ctx.lineTo(right, ZY(0)); ctx.stroke();
  ctx.lineWidth = 1.4;
  for (i2 = v.i0 + 1; i2 < v.i1; i2++) {
    if (zv[i2] == null || zv[i2 - 1] == null) continue;
    ctx.strokeStyle = zv[i2] >= 0 ? UP : DN;
    ctx.beginPath(); ctx.moveTo(v.X(i2 - 1), ZY(zv[i2 - 1])); ctx.lineTo(v.X(i2), ZY(zv[i2])); ctx.stroke();
  }
  var li2 = v.i1 - 1;
  if (zv[li2] != null) {
    ctx.font = "9px Menlo, monospace"; ctx.textAlign = "right";
    ctx.fillStyle = zv[li2] >= 0 ? UP : DN;
    ctx.fillText((zv[li2] >= 0 ? "+" : "") + (Math.abs(zv[li2]) >= 10000 ? (zv[li2] / 10000).toFixed(2) + "亿" : Math.round(zv[li2]) + "万"), right - 4, y2 + 9);
  }
}

var INDS = [["ma", "EMA"], ["tsline", "分时线"], ["lr", "回归通道"], ["boll", "BOLL"], ["fvg", "FVG"], ["liq", "流动性"], ["ms", "结构"], ["ob", "订单块"], ["pdhl", "昨高低"], ["tdhl", "今高低"], ["monitor", "监测"], ["atri", "三角形"], ["rtflow", "实时主力"], ["zlyy", "主力净额"], ["solid", "实线"]];
function buildInds() {
  var el = document.querySelector("[data-inds]");
  if (!el) return;

  // 昨高低三态切换：日 → 周 → 关
  var pb = document.createElement("button");

  pb.className = "btn tabbtn" + (S.pdhlMode !== "off" ? " on" : "");
  pb.type = "button"; pb.textContent = plb[S.pdhlMode] || "昨高低";
  pb.addEventListener("click", function () {
    S.pdhlMode = S.pdhlMode === "day" ? "week" : (S.pdhlMode === "week" ? "off" : "day");
    store(); buildInds(); draw();
    hint(S.pdhlMode === "off" ? "昨高昨低已关闭" : (S.pdhlMode === "week" ? "显示上周高/低 + 上周蜡烛" : "显示昨日高/低 + 昨日蜡烛"));
  });
  el.appendChild(pb);
  INDS.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "btn tabbtn" + (S.ind[t[0]] ? " on" : "");
    b.type = "button"; b.textContent = t[1];

      if (t[0] === "rtflow" && S.ind.rtflow && !S.rtflow.length) fetchFFlowMin(S.active, function () { draw(); });
    });
    el.appendChild(b);
  });
}
