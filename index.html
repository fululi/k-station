<script>
"use strict";
/* ================= 数据层：东财 JSONP（手机浏览器可跨域） ================= */
var UT = "fa5fd1943c7b386f172d6893dbfba10b";
function secidOf(code) { return /^[569]/.test(code) ? "1." + code : "0." + code; }
function jsonp(url, cb) {
  var name = "emcb_" + Date.now() + "_" + Math.round(Math.random() * 1e9);
  var s = document.createElement("script");
  var done = false;
  function fin(err, data) {
    if (done) return; done = true;
    if (s.parentNode) s.parentNode.removeChild(s);
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    cb(err, data);
  }
  window[name] = function (d) { fin(null, d); };
  s.onerror = function () { fin(new Error("网络错误")); };
  s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "cb=" + name;
  document.head.appendChild(s);
  setTimeout(function () { fin(new Error("请求超时")); }, 12000);
}
function mktOf(code) { return /^[569]/.test(code) ? "sh" : (/^[03]/.test(code) ? "sz" : "sh"); }
function fetchJSON(url, cb) {
  var done = false;
  var to = setTimeout(function () { if (!done) { done = true; cb(new Error("请求超时")); } }, 10000);
  fetch(url).then(function (r) { return r.json(); }).then(function (d) {
    if (!done) { done = true; clearTimeout(to); cb(null, d); }
  }).catch(function (e) { if (!done) { done = true; clearTimeout(to); cb(e); } });
}
// 腾讯格式 [日期,开,收,高,低,量]（分钟线日期为 yyyyMMddHHmm）→ 统一 [date, o, h, l, c, v]
function txRows(rows) {
  return rows.map(function (r) {
    var ds = String(r[0]);
    if (ds.length === 12) ds = ds.slice(0, 4) + "-" + ds.slice(4, 6) + "-" + ds.slice(6, 8) + " " + ds.slice(8, 10) + ":" + ds.slice(10, 12);
    return [ds, +r[1], +r[3], +r[4], +r[2], +r[5]];
  }).filter(function (r) { return r[4] > 0; });
}
function fetchKlineTX(code, klt, cb) {
  var prefix = mktOf(code) + code;
  if (klt === "101" || klt === "102") {
    var per = klt === "101" ? "day" : "week";
    fetchJSON("https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=" + prefix + "," + per + ",,,320,qfq", function (err, d) {
      var sd = d && d.data && d.data[prefix];
      var rows = sd && (sd["qfq" + per] || sd[per]);
      if (err || !rows || !rows.length) { cb(err || new Error("腾讯无K线")); return; }
      cb(null, txRows(rows), "");
    });
  } else {
    fetchJSON("https://ifzq.gtimg.cn/appstock/app/kline/mkline?param=" + prefix + ",m" + klt + ",,320", function (err, d) {
      var sd = d && d.data && d.data[prefix];
      var rows = sd && sd["m" + klt];
      if (err || !rows || !rows.length) { cb(err || new Error("腾讯无分钟K线")); return; }
      cb(null, txRows(rows), "");
    });
  }
}
// 东财 JSONP 兜底（腾讯失败时）
function fetchKlineEM(code, klt, cb) {
  var url = "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=" + secidOf(code) +
    "&ut=" + UT + "&fields1=f1,f2,f3&fields2=f51,f52,f53,f54,f55,f56&klt=" + klt + "&fqt=1&end=20500101&lmt=320";
  jsonp(url, function (err, d) {
    if (err || !d || !d.data || !d.data.klines) { cb(err || new Error("无K线数据")); return; }
    // 东财格式 "日期,开,收,高,低,量" → [date, o, h, l, c, v]
    var kl = d.data.klines.map(function (row) {
      var p = row.split(",");
      return [p[0], +p[1], +p[3], +p[4], +p[2], +p[5]];
    }).filter(function (r) { return r[4] > 0; });
    cb(null, kl, d.data.name || "");
  });
}
function fetchKline(code, klt, cb) {
  fetchKlineTX(code, klt, function (err, kl, name) {
    if (!err && kl && kl.length) { cb(null, kl, name); return; }
    fetchKlineEM(code, klt, cb);
  });
}
function fetchQuoteEM(code, cb) {
  var url = "https://push2.eastmoney.com/api/qt/stock/get?secid=" + secidOf(code) +
    "&ut=" + UT + "&fltt=2&invt=2&fields=f43,f57,f58,f60,f117,f170";
  jsonp(url, function (err, d) {
    if (err || !d || !d.data || !(d.data.f43 > 0)) { cb(err || new Error("无报价")); return; }
    cb(null, { price: d.data.f43, name: d.data.f58, prev: d.data.f60, pct: d.data.f170, floatMV: d.data.f117 > 0 ? d.data.f117 : 0 });
  });
}
// 腾讯行情快照（qt.gtimg.cn，GBK 文本，CORS 放行）：f[1]名称 f[3]现价 f[4]昨收 f[44]流通市值(亿)
function fetchQuote(code, cb) {
  var prefix = mktOf(code) + code;
  var done = false;
  var to = setTimeout(fail, 8000);
  function fail() { if (!done) { done = true; clearTimeout(to); fetchQuoteEM(code, cb); } }
  fetch("https://qt.gtimg.cn/q=" + prefix)
    .then(function (r) { return r.arrayBuffer(); })
    .then(function (buf) {
      if (done) return;
      var f = String(new TextDecoder("gbk").decode(buf)).split("~");
      var price = parseFloat(f[3]), prev = parseFloat(f[4]);
      if (!(price > 0)) { fail(); return; }
      done = true; clearTimeout(to);
      var fmv = parseFloat(f[44]);
      cb(null, { price: price, name: f[1], prev: prev, pct: prev > 0 ? (price / prev - 1) * 100 : 0, floatMV: fmv > 0 ? fmv * 1e8 : 0 });
    })
    .catch(fail);
}
// 日级资金流历史（东财）：f51日期 f52主力净额(元) f57主力净占比% —— DDX≈/主力意愿≈的数据源
function fetchFFlow(code, cb) {
  var url = "https://push2his.eastmoney.com/api/qt/stock/fflow/daykline/get?secid=" + secidOf(code) +
    "&ut=" + UT + "&lmt=320&end=20500101&fields1=f1,f2,f3,f7&fields2=f51,f52,f53,f54,f55,f56,f57";
  jsonp(url, function (err, d) {
    if (err || !d || !d.data || !d.data.klines) { if (cb) cb(err || new Error("无资金流")); return; }
    S.fflow = d.data.klines.map(function (row) {
      var p = row.split(",");
      return { d: p[0], main: +p[1], mainPct: +p[6] };
    });
    if (cb) cb(null);
  });
}
/* ================= 状态与持久化 ================= */
var PERIODS = [["101", "日线"], ["102", "周线"], ["60", "60分"], ["30", "30分"], ["15", "15分"], ["5", "5分"]];
var TOOLS = [["trend", "趋势线", 2], ["hline", "水平线", 1], ["ray", "射线", 2], ["rect", "矩形", 2], ["fib", "斐波那契", 2], ["pct", "测幅%", 2], ["tri", "三角形", 3], ["xabcd", "蝴蝶XABCD", 5]];
var S = {
  codes: [["600105", "永鼎股份"], ["600176", "中国巨石"], ["515880", "通信ETF"]],
  active: "600105", klt: "101",
  kl: [], name: "", quote: null,
  end: 0, count: 0,
  tool: null, pending: [], selected: -1, cross: null, ghost: null,
  ind: { ma: true, fvg: true, liq: true, ms: true, ob: true, ddx: true, zlyy: true, pdhl: true },
  fflow: [], floatMV: 0
};
var DRAW = {}; // "code:klt" -> [{type, pts:[{i,p}...]}]
function store() {
  try {
    localStorage.setItem("ksm_v1", JSON.stringify({ codes: S.codes, active: S.active, klt: S.klt, ind: S.ind, draw: DRAW }));
  } catch (e) {}
}
function restore() {
  try {
    var o = JSON.parse(localStorage.getItem("ksm_v1") || "null");
    if (!o) return;
    if (o.codes && o.codes.length) S.codes = o.codes;
    if (o.active) S.active = o.active;
    if (o.klt) S.klt = o.klt;
    if (o.ind) { S.ind = o.ind; if (S.ind.ma == null) S.ind.ma = true; if (S.ind.pdhl == null) S.ind.pdhl = true; }
    if (o.draw) DRAW = o.draw;
  } catch (e) {}
}
function dkey() { return S.active + ":" + S.klt; }
function dlist() { var k = dkey(); if (!DRAW[k]) DRAW[k] = []; return DRAW[k]; }
/* ================= 图表渲染 ================= */
var cv = document.querySelector("[data-chart]");
var hintEl = document.querySelector("[data-hint]");
function hint(t) { hintEl.innerHTML = t || ""; }
function cls(p) { return p == null || isNaN(p) ? "flat" : (p > 0 ? "up" : (p < 0 ? "down" : "flat")); }
function dec() { return S.active === "515880" ? 3 : 2; }
function fwp(v) { var d2 = dec(); return v == null || isNaN(v) ? "—" : v.toFixed(d2); }
var UP = "#ff6f66", DN = "#35d99a", DIM = "#5d6f64", GRID = "rgba(38,51,44,0.6)", SEL = "#ffd21f";
function maArr(kl, n) {
  var out = new Array(kl.length).fill(null), s = 0;
  for (var i = 0; i < kl.length; i++) {
    s += kl[i][4];
    if (i >= n) s -= kl[i - n][4];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}
function macdArr(kl) {
  var e12 = 0, e26 = 0, dea = 0, init = false;
  var dif = [], de = [], bar = [];
  for (var i = 0; i < kl.length; i++) {
    var c = kl[i][4];
    if (!init) { e12 = c; e26 = c; dea = 0; init = true; }
    else { e12 = e12 * 11 / 13 + c * 2 / 13; e26 = e26 * 25 / 27 + c * 2 / 27; }
    var d2 = e12 - e26; dea = dea * 8 / 10 + d2 * 2 / 10;
    dif.push(d2); de.push(dea); bar.push((d2 - dea) * 2);
  }
  return { dif: dif, dea: de, bar: bar };
}
function view() {
  var n = S.kl.length;
  if (!n) return null;
  var w = cv.clientWidth, hh = cv.clientHeight;
  var padL = 6, padR = 56, padT = 10, padB = 18;
  var plotW = w - padL - padR;
  var avail = hh - padT - padB;
  var volH = Math.round(avail * 0.11);
  var macdH = Math.round(avail * 0.13);
  var ddxH = S.ind.ddx ? Math.round(avail * 0.09) : 0;
  var zlyyH = S.ind.zlyy ? Math.round(avail * 0.09) : 0;
  var subN = 2 + (ddxH ? 1 : 0) + (zlyyH ? 1 : 0);
  var priceH = avail - volH - macdH - ddxH - zlyyH - 6 * subN;
  if (!S.count) S.count = Math.max(30, Math.round(plotW / 6.5));
  S.count = Math.max(15, Math.min(250, S.count));
  var i1 = Math.max(Math.min(S.end || n, n), Math.min(S.count, n));
  var i0 = Math.max(0, i1 - Math.min(S.count, n));
  S.end = i1;
  var hi = -1e18, lo = 1e18, vMax = 1;
  for (var i = i0; i < i1; i++) {
    if (S.kl[i][2] > hi) hi = S.kl[i][2];
    if (S.kl[i][3] < lo) lo = S.kl[i][3];
    if (S.kl[i][5] > vMax) vMax = S.kl[i][5];
  }
  if (!(hi > lo)) { hi = lo + 1; }
  var step = plotW / (i1 - i0);
  var volY = padT + priceH + 6, macdY = volY + volH + 6;
  var ddxY = macdY + macdH + 6;
  var zlyyY = ddxY + (ddxH ? ddxH + 6 : 0);
  var bottom = zlyyH ? zlyyY + zlyyH : (ddxH ? ddxY + ddxH : macdY + macdH);
  return {
    w: w, hh: hh, i0: i0, i1: i1, n: n, step: step, padL: padL, padR: padR, padT: padT,
    priceH: priceH, volY: volY, volH: volH, macdY: macdY, macdH: macdH, vMax: vMax,
    ddxY: ddxY, ddxH: ddxH, zlyyY: zlyyY, zlyyH: zlyyH, bottom: bottom,
    X: function (i) { return padL + (i - i0 + 0.5) * step; },
    I: function (x) { return Math.max(0, Math.min(n - 1, Math.round(i0 + (x - padL) / step - 0.5))); },
    Y: function (p) { return padT + (hi - p) / (hi - lo) * priceH; },
    P: function (y) { return hi - (y - padT) / priceH * (hi - lo); },
    hi: hi, lo: lo
  };
}

/* ---- 画线锚点：{d: 日期串, p: 价格}，渲染时按日期解析到 bar 下标（换数据不漂移） ---- */
function idxMap(v) {
  var m = {};
  for (var i = 0; i < S.kl.length; i++) m[S.kl[i][0]] = i;
  return m;
}
function anchorXY(v, im, a) {
  var i = im[a.d];
  if (i == null) return null;
  return { x: v.X(i), y: v.Y(a.p), i: i };
}
var FIB_R = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1, 1.272, 1.618];
var FIB_C = { "0": "#9fb0bc", "0.236": "#57a7ff", "0.382": "#3fd6c2", "0.5": "#b78cff", "0.618": "#f0c93f", "0.786": "#ff9a5c", "1": "#ff6f66", "1.272": "#ff5c8a", "1.618": "#e05cd0" };
function ptsOf(v, im, pts) {
  var out = [];
  for (var k = 0; k < pts.length; k++) {
    var q = anchorXY(v, im, pts[k]);
    if (!q) return null;
    out.push(q);
  }
  return out;
}
function drawSeg(ctx, a, b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
function renderOneDrawing(ctx, v, im, dg, sel) {
  var pts = ptsOf(v, im, dg.pts);
  if (!pts) return;
  var right = v.padL + (v.i1 - v.i0) * v.step;
  ctx.strokeStyle = sel ? SEL : "#e6b43c";
  ctx.fillStyle = sel ? SEL : "#e6b43c";
  ctx.lineWidth = sel ? 2.4 : 1.6;
  ctx.setLineDash([]);
  ctx.font = "10px -apple-system, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  var t = dg.type;
  var MINP = { trend: 2, hline: 1, ray: 2, rect: 2, fib: 2, pct: 2, tri: 3, xabcd: 5 };
  if (pts.length < (MINP[t] || 2)) {
    // 进行中的多点画线：只画已落锚点之间的预览连线和点
    ctx.strokeStyle = sel ? SEL : "#e6b43c";
    for (var pp = 0; pp < pts.length - 1; pp++) drawSeg(ctx, pts[pp], pts[pp + 1]);
    for (var pp2 = 0; pp2 < pts.length; pp2++) {
      ctx.beginPath(); ctx.arc(pts[pp2].x, pts[pp2].y, 3, 0, 7); ctx.fill();
    }
    return;
  }
  if (t === "trend") { drawSeg(ctx, pts[0], pts[1]); }
  else if (t === "ray") {
    var dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
    if (Math.abs(dx) < 0.001) dx = 0.001;
    var yEnd = pts[0].y + dy / dx * (right + 80 - pts[0].x);
    drawSeg(ctx, pts[0], { x: right + 80, y: yEnd });
  }
  else if (t === "hline") {
    ctx.beginPath(); ctx.moveTo(v.padL, pts[0].y); ctx.lineTo(right, pts[0].y); ctx.stroke();
    ctx.fillText(fwp(dg.pts[0].p), right - 52, pts[0].y - 7);
  }
  else if (t === "rect") {
    var x0 = Math.min(pts[0].x, pts[1].x), x1 = Math.max(pts[0].x, pts[1].x);
    var y0 = Math.min(pts[0].y, pts[1].y), y1 = Math.max(pts[0].y, pts[1].y);
    ctx.fillStyle = "rgba(87,167,255,0.10)";
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.strokeStyle = sel ? SEL : "#57a7ff";
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  }
  else if (t === "fib") {
    var p1 = dg.pts[0].p, p2 = dg.pts[1].p;
    var fx0 = Math.min(pts[0].x, pts[1].x);
    for (var fi = 0; fi < FIB_R.length; fi++) {
      var r = FIB_R[fi], pr = p1 + (p2 - p1) * r, yy = v.Y(pr);
      if (yy < v.padT - 30 || yy > v.padT + v.priceH + 30) continue;
      ctx.strokeStyle = FIB_C[String(r)] || "#9fb0bc";
      ctx.lineWidth = r === 0 || r === 1 ? 1.8 : 1;
      ctx.setLineDash(r > 1 ? [4, 4] : []);
      ctx.beginPath(); ctx.moveTo(fx0, yy); ctx.lineTo(right, yy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fillText(r + "  " + fwp(pr), fx0 + 3, yy - 7);
    }

/* ================= DDX≈ / 主力意愿≈ 副图（与桌面端同口径：东财日级资金流推算） ================= */
